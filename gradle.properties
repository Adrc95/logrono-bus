#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# Experimental: incremental compilation for Kotlin/Native (speeds up iOS framework rebuilds)
kotlin.incremental.native=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Compose 1.13 asks for compileSdk 37.1 while the KMP library target only exposes
# the major version; the app itself compiles against 37.1.
android.experimental.disableCompileSdkChecks=true

name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spotless:
    name: Spotless
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew spotlessCheck --stacktrace

  jvm:
    name: Unit tests (JVM, Android)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      # The desktop and Android host targets run the same commonTest sources.
      - run: ./gradlew jvmTest testAndroidHostTest --stacktrace
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: '**/build/reports/tests/**'

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :app:androidApp:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: app/androidApp/build/outputs/apk/debug/*.apk

  android-tests:
    name: Android device tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      # The emulator needs KVM, which the runner grants only to the kvm group.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew connectedAndroidDeviceTest --stacktrace
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-test-reports
          path: '**/build/reports/androidTests/**'

  apple:
    name: iOS framework + desktop
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      # Kotlin/Native caches are large; only main writes them so PRs cannot fill the quota.
      - uses: actions/cache/restore@v6
        id: konan-cache
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-
      - run: ./gradlew :app:shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace
      - run: ./gradlew :app:shared:iosSimulatorArm64Test --stacktrace
      - run: ./gradlew :app:desktopApp:assemble --stacktrace
      - name: Build the iOS app
        run: >
          xcodebuild
          -project app/iosApp/iosApp.xcodeproj
          -target iosApp
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          build
          CODE_SIGNING_ALLOWED=NO
          ARCHS=arm64
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main' && steps.konan-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.konan
          key: ${{ steps.konan-cache.outputs.cache-primary-key }}

  web:
    name: Web (wasm) distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :app:webApp:wasmJsBrowserDistribution --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: web-distribution
          path: app/webApp/build/dist/**

  web-tests:
    name: Web (wasm) tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      # The Compose modules cannot run their tests in a browser (CMP-4906), so this targets the
      # module whose wasm tests do run instead of the whole aggregate task.
      - run: ./gradlew :core:database:wasmJsBrowserTest --stacktrace
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web-test-reports
          path: '**/build/reports/tests/**'
